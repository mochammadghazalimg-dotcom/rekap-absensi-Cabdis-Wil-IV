<!DOCTYPE html>
<html lang="id">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Rekap Absensi & Indisipliner - Cabdin Wil IV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar-link { transition: all 0.3s ease; cursor: pointer; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #1e40af; border-left: 4px solid #60a5fa; }
        .glass-card { background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 12px; }
        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: #f1f5f9; }
        .card-certificate { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); border: 3px solid #f59e0b; }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigasi -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl z-20">
        <div class="p-6 flex flex-col items-center justify-center border-b border-slate-700 text-center">
            <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center mb-2 drop-shadow-md">
                <i class="fa-solid fa-building-flag text-2xl text-blue-600"></i>
            </div>
            <h1 class="text-lg font-bold tracking-wider uppercase text-blue-400">Cabdin Wil. IV</h1>
            <p class="text-xs text-slate-400">Sistem Presensi Terpadu</p>
        </div>
        <nav class="flex-1 mt-6">
            <ul class="space-y-1">
                <li><a onclick="switchView('dashboard')" id="nav-dashboard" class="sidebar-link active flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-chart-line w-6 text-center mr-3"></i> Dashboard Utama</a></li>
                <li><a onclick="switchView('dataPegawai')" id="nav-dataPegawai" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-users w-6 text-center mr-3"></i> Data Pegawai</a></li>
                <li><a onclick="switchView('dataSekolah')" id="nav-dataSekolah" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-school w-6 text-center mr-3"></i> Data Sekolah</a></li>
                <li><a onclick="switchView('rekapAbsen')" id="nav-rekapAbsen" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-calendar-check w-6 text-center mr-3"></i> Rekap Absen</a></li>
                <li><a onclick="switchView('laporanIndisipliner')" id="nav-laporanIndisipliner" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-user-xmark w-6 text-center mr-3"></i> Lap. Indisipliner</a></li>
            </ul>
        </nav>
        <div class="p-4 border-t border-slate-700 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">AC</div>
            <div>
                <p class="text-sm font-semibold">Admin Cabdin</p>
                <p class="text-xs text-green-400"><i class="fa-solid fa-circle text-[8px] mr-1"></i> Online</p>
            </div>
        </div>
    </aside>

    <!-- Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative bg-slate-50">
        <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10 px-8 py-4 flex justify-between items-center">
            <h2 id="page-title" class="text-xl font-bold text-slate-800">Dashboard Utama</h2>
            <div class="flex items-center gap-4 text-sm text-slate-500 font-medium">
                <i class="fa-regular fa-clock text-blue-500"></i>
                <span id="current-time">Waktu memuat...</span>
            </div>
        </header>
        <div id="content-area" class="p-8 w-full h-full"></div>
    </main>

    <script>
        let LIBUR_NASIONAL = []; 
        let defaultSekolah = [
            { id: 1, nama: "SMKN 6 WAJO", npsn: "40303160", kepsek: "Drs. Muhammad, M.Pd", nip: "196801011995031001" },
            { id: 2, nama: "SMAN 9 WAJO", npsn: "40303161", kepsek: "Andi Ahmad, S.Pd", nip: "197202022000031002" },
            { id: 3, nama: "SMAN 3 WAJO", npsn: "40303162", kepsek: "Siti Rahma, M.Si", nip: "197503032005012003" }
        ];

        let dummySekolah = [...defaultSekolah];
        let dummyAbsensi = [];      
        let dummyPegawai = []; // MASTER DATA PEGAWAI ASN
        let storeLogHarian = {}; // LOG HARIAN UNIK: key -> "NIP_YYYY-MM-DD"
        let currentChart = null;
        let currentPieChart = null;

        function updateTime() {
            try {
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                const timeEl = document.getElementById('current-time');
                if(timeEl) timeEl.innerText = now.toLocaleDateString('id-ID', options);
            } catch (e) {}
        }
        setInterval(updateTime, 30000);

        function muatKalenderLiburOtomatis() {
            let tahun = new Date().getFullYear();
            if(typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(function(data) {
                    if (data && Array.isArray(data)) LIBUR_NASIONAL = data;
                }).getLiburOtomatisDariGoogle(tahun);
            }
        }

        window.onload = function() {
            updateTime();
            muatKalenderLiburOtomatis();
            
            const contentArea = document.getElementById('content-area');
            if (contentArea) {
                contentArea.innerHTML = '<div class="text-center mt-20 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-600"></i><br>Menghubungkan ke Database Google Spreadsheet...</div>';
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(db) {
                        if (db) {
                            if (db.sekolah && db.sekolah.length > 0) dummySekolah = db.sekolah;
                            if (db.absensi && db.absensi.length > 0) dummyAbsensi = db.absensi;
                            if (db.pegawai && db.pegawai.length > 0) dummyPegawai = db.pegawai;
                            if (db.logHarian) storeLogHarian = db.logHarian;
                        }
                        switchView('dashboard');
                    })
                    .withFailureHandler(function(err) {
                        console.warn("Koneksi Spreadsheet ditangguhkan, memuat antarmuka lokal:", err);
                        switchView('dashboard');
                    })
                    .ambilSemuaDataFromSheet();
            } else {
                switchView('dashboard');
            }
        };

        function hitungHariKerjaBulanIni(year, month) {
            let totalWorkdays = 0;
            let daysInMonth = new Date(year, month, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                let dateObj = new Date(year, month - 1, d);
                let dayOfWeek = dateObj.getDay();
                let yyyy = dateObj.getFullYear();
                let mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                let dd = String(dateObj.getDate()).padStart(2, '0');
                let dateString = `${yyyy}-${mm}-${dd}`;
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !LIBUR_NASIONAL.includes(dateString)) { 
                    totalWorkdays++;
                }
            }
            return totalWorkdays; 
        }

        function parseTanggalKeObject(tanggalStr) {
            if(!tanggalStr) return null;
            let str = String(tanggalStr).trim();
            let parts = str.split(/[\/\-\s.]+/);

            let yyyy = new Date().getFullYear();
            let mm = new Date().getMonth() + 1;
            let dd = 1;

            if (parts.length >= 3) {
                if (parts[0].length === 4) {
                    yyyy = parseInt(parts[0], 10);
                    mm = parseInt(parts[1], 10);
                    dd = parseInt(parts[2], 10);
                } else {
                    dd = parseInt(parts[0], 10);
                    mm = parseInt(parts[1], 10);
                    yyyy = parseInt(parts[2], 10);
                }
            } else {
                return null;
            }

            if(isNaN(yyyy) || isNaN(mm) || isNaN(dd)) return null;
            return { yyyy, mm, dd };
        }

        function switchView(viewId) {
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById('nav-' + viewId);
            if(activeNav) activeNav.classList.add('active');

            const contentArea = document.getElementById('content-area');
            const pageTitle = document.getElementById('page-title');

            if (viewId === 'dashboard') { pageTitle.innerText = "Dashboard Utama"; renderDashboard(contentArea); }
            else if (viewId === 'dataPegawai') { pageTitle.innerText = "Data Pegawai ASN"; renderDataPegawai(contentArea); }
            else if (viewId === 'dataSekolah') { pageTitle.innerText = "Data Sekolah"; renderDataSekolah(contentArea); }
            else if (viewId === 'rekapAbsen') { pageTitle.innerText = "Rekap Absen Sekolah"; renderRekapAbsen(contentArea); }
            else if (viewId === 'laporanIndisipliner') { pageTitle.innerText = "Laporan Indisipliner"; renderLaporan(contentArea); }
        }

        function goToRekapAbsen(sekolahId) {
            switchView('rekapAbsen');
            setTimeout(() => {
                const filterSelect = document.getElementById('filterSekolah');
                if(filterSelect) { 
                    filterSelect.value = sekolahId; 
                    terapkanFilterAbsen(); 
                }
            }, 100);
        }

        // ==========================================
        // MENU DASHBOARD UTAMA
        // ==========================================
        function renderDashboard(container) {
            if(!container) return;
            let totalPegawai = dummyPegawai.length > 0 ? dummyPegawai.length : (dummyAbsensi.length || 0);
            let totalSekolah = dummySekolah.length || 0;
            let totTerlambatMin = 0, totCepatPulangMin = 0, totIzinSakit = 0, totTanpaKet = 0;
            
            let schoolStats = dummySekolah.map(s => {
                let pegSekolah = dummyPegawai.filter(p => (p.sekolah || '').toUpperCase().includes(s.nama.toUpperCase()));
                let totalASN = pegSekolah.length || 1;

                return { 
                    id: s.id, nama: s.nama, totalASN: totalASN,
                    terlambatMin: 0, cepatPulangMin: 0, tanpaKet: 0, hadir: 0,
                    avgTerlambatMin: 0, avgCepatPulangMin: 0, avgTanpaKet: 0
                };
            });

            dummyAbsensi.forEach(absen => {
                totTerlambatMin += parseInt(absen.terlambatMin) || 0;
                totCepatPulangMin += parseInt(absen.cepatPulangMin) || 0;
                totIzinSakit += parseInt(absen.izinSakit) || 0;
                totTanpaKet += parseInt(absen.tanpaKet) || 0;

                let s = schoolStats.find(x => String(x.id) === String(absen.sekolahId) || x.nama.toUpperCase().includes((absen.sekolah || '').toUpperCase()));
                if(s) {
                    s.terlambatMin += parseInt(absen.terlambatMin) || 0;
                    s.cepatPulangMin += parseInt(absen.cepatPulangMin) || 0;
                    s.tanpaKet += parseInt(absen.tanpaKet) || 0;
                    s.hadir += parseInt(absen.hadir) || 0;
                }
            });

            schoolStats.forEach(s => {
                s.avgTanpaKet = parseFloat((s.tanpaKet / s.totalASN).toFixed(1));
                s.avgTerlambatMin = Math.round(s.terlambatMin / s.totalASN);
                s.avgCepatPulangMin = Math.round(s.cepatPulangMin / s.totalASN);
            });

            let top5AlpaSekolah = [...schoolStats].sort((a,b) => b.avgTanpaKet - a.avgTanpaKet).slice(0, 5);
            let top5TerlambatSekolah = [...schoolStats].sort((a,b) => b.avgTerlambatMin - a.avgTerlambatMin).slice(0, 5);
            let top5CepatPulangSekolah = [...schoolStats].sort((a,b) => b.avgCepatPulangMin - a.avgCepatPulangMin).slice(0, 5);

            let candidatesASN = dummyAbsensi.filter(a => (parseInt(a.hadir) || 0) > 0);
            if (candidatesASN.length === 0) candidatesASN = [...dummyAbsensi];

            let top5ASN = candidatesASN.sort((a, b) => {
                let hadirA = parseInt(a.hadir) || 0; let hadirB = parseInt(b.hadir) || 0;
                let tanpaKetA = parseInt(a.tanpaKet) || 0; let tanpaKetB = parseInt(b.tanpaKet) || 0;
                if (hadirB !== hadirA) return hadirB - hadirA;
                return tanpaKetA - tanpaKetB;
            }).slice(0, 5);

            const bulanIni = new Date().toLocaleString('id-ID', { month: 'long', year: 'numeric' });

            container.innerHTML = `
                <!-- RINGKASAN METRIK -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="glass-card p-6 border-l-4 border-blue-500 flex items-center">
                        <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4"><i class="fa-solid fa-school text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Total Sekolah</p><p class="text-2xl font-bold text-slate-800">${totalSekolah}</p></div>
                    </div>
                    <div class="glass-card p-6 border-l-4 border-emerald-500 flex items-center">
                        <div class="p-3 rounded-full bg-emerald-100 text-emerald-600 mr-4"><i class="fa-solid fa-users text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Pegawai Terekam</p><p class="text-2xl font-bold text-slate-800">${totalPegawai}</p></div>
                    </div>
                    <div class="glass-card p-6 border-l-4 border-orange-500 flex items-center">
                        <div class="p-3 rounded-full bg-orange-100 text-orange-600 mr-4"><i class="fa-solid fa-clock text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Total Keterlambatan</p><p class="text-2xl font-bold text-orange-600">${totTerlambatMin} <span class="text-xs font-normal">Menit</span></p></div>
                    </div>
                    <div class="glass-card p-6 border-l-4 border-red-500 flex items-center">
                        <div class="p-3 rounded-full bg-red-100 text-red-600 mr-4"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Tanpa Keterangan</p><p class="text-2xl font-bold text-red-600">${totTanpaKet} <span class="text-xs font-normal">Hari</span></p></div>
                    </div>
                </div>

                <!-- TOP 5 ASN TELADAN -->
                <div class="mb-8">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg text-amber-700 flex items-center">
                            <i class="fa-solid fa-certificate text-yellow-500 text-xl mr-2"></i> Top 5 ASN Teladan Presensi (${bulanIni})
                        </h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        ${top5ASN.length > 0 ? top5ASN.map((asn, i) => `
                            <div class="glass-card bg-gradient-to-b from-amber-50 to-white border border-amber-200 p-4 rounded-xl flex flex-col items-center text-center relative overflow-hidden">
                                <div class="absolute top-0 right-0 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-bl-lg">#${i+1} TELADAN</div>
                                <div class="w-12 h-12 rounded-full bg-amber-100 border-2 border-amber-400 flex items-center justify-center text-amber-600 mb-2 mt-1">
                                    <i class="fa-solid fa-user-check text-xl"></i>
                                </div>
                                <p class="font-bold text-xs text-slate-800 truncate w-full" title="${asn.nama}">${asn.nama}</p>
                                <p class="text-[10px] text-slate-500 truncate w-full mb-2">${asn.sekolah}</p>
                                <div class="w-full bg-white p-2 rounded border border-amber-100 text-[10px] grid grid-cols-2 gap-1 text-slate-600">
                                    <div>Hadir: <b class="text-emerald-600">${asn.hadir || 0}</b></div>
                                    <div>Alpa: <b class="text-slate-800">${asn.tanpaKet || 0}</b></div>
                                </div>
                            </div>
                        `).join('') : '<div class="col-span-5 p-4 text-center text-slate-400 glass-card">Belum ada data presensi ASN.</div>'}
                    </div>
                </div>

                <!-- PERINGKAT EVALUASI PRESENSI SEKOLAH -->
                <div class="mb-8">
                    <h3 class="font-bold text-lg text-red-700 flex items-center mb-4">
                        <i class="fa-solid fa-box-archive text-red-600 mr-2"></i> Peringkat Evaluasi Presensi Sekolah (Tinggi Pelanggaran Rata-Rata per ASN)
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass-card p-0 overflow-hidden border-t-4 border-red-600">
                            <div class="bg-red-50 p-3 font-semibold text-red-800 text-sm flex items-center justify-between">
                                <span><i class="fa-solid fa-square-full text-red-600 mr-2"></i> Tanpa Ket. Terbanyak</span>
                            </div>
                            <ul class="p-2">
                                ${top5AlpaSekolah.map((item, i) => `
                                    <li onclick="goToRekapAbsen('${item.id}')" class="flex justify-between items-center p-2.5 text-xs border-b last:border-0 border-slate-100 clickable-row">
                                        <div class="truncate font-medium text-slate-700">
                                            <span>${i+1}.${item.nama}</span>
                                            <span class="text-[10px] text-slate-400 block">${item.totalASN} ASN (${item.tanpaKet} Hari)</span>
                                        </div>
                                        <span class="bg-red-100 text-red-700 font-bold px-2 py-0.5 rounded whitespace-nowrap">${item.avgTanpaKet} Hari/ASN</span>
                                    </li>`).join('')}
                            </ul>
                        </div>
                        <div class="glass-card p-0 overflow-hidden border-t-4 border-orange-500">
                            <div class="bg-orange-50 p-3 font-semibold text-orange-800 text-sm flex items-center justify-between">
                                <span><i class="fa-solid fa-square-full text-orange-500 mr-2"></i> Keterlambatan Terbanyak</span>
                            </div>
                            <ul class="p-2">
                                ${top5TerlambatSekolah.map((item, i) => `
                                    <li onclick="goToRekapAbsen('${item.id}')" class="flex justify-between items-center p-2.5 text-xs border-b last:border-0 border-slate-100 clickable-row">
                                        <div class="truncate font-medium text-slate-700">
                                            <span>${i+1}.${item.nama}</span>
                                            <span class="text-[10px] text-slate-400 block">${item.totalASN} ASN (${item.terlambatMin} Mnt)</span>
                                        </div>
                                        <span class="bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded whitespace-nowrap">${item.avgTerlambatMin} Mnt/ASN</span>
                                    </li>`).join('')}
                            </ul>
                        </div>
                        <div class="glass-card p-0 overflow-hidden border-t-4 border-amber-500">
                            <div class="bg-amber-50 p-3 font-semibold text-amber-800 text-sm flex items-center justify-between">
                                <span><i class="fa-solid fa-square-full text-amber-500 mr-2"></i> Pulang Cepat Terbanyak</span>
                            </div>
                            <ul class="p-2">
                                ${top5CepatPulangSekolah.map((item, i) => `
                                    <li onclick="goToRekapAbsen('${item.id}')" class="flex justify-between items-center p-2.5 text-xs border-b last:border-0 border-slate-100 clickable-row">
                                        <div class="truncate font-medium text-slate-700">
                                            <span>${i+1}.${item.nama}</span>
                                            <span class="text-[10px] text-slate-400 block">${item.totalASN} ASN (${item.cepatPulangMin} Mnt)</span>
                                        </div>
                                        <span class="bg-amber-100 text-amber-700 font-bold px-2 py-0.5 rounded whitespace-nowrap">${item.avgCepatPulangMin} Mnt/ASN</span>
                                    </li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- DIAGRAM CHART -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    <div class="glass-card p-6 lg:col-span-2">
                        <h3 class="font-bold text-slate-700 mb-4">Statistik Indisipliner per Sekolah</h3>
                        <canvas id="barChart" style="max-height: 250px;"></canvas>
                    </div>
                    <div class="glass-card p-6 flex flex-col items-center">
                        <h3 class="font-bold text-slate-700 mb-4 w-full text-left">Rasio Keseluruhan</h3>
                        <div class="relative w-full" style="max-width: 250px;">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                try {
                    const ctxBar = document.getElementById('barChart');
                    const ctxPie = document.getElementById('pieChart');

                    if(ctxBar) {
                        if (currentChart) currentChart.destroy();
                        currentChart = new Chart(ctxBar, {
                            type: 'bar',
                            data: {
                                labels: schoolStats.map(s => s.nama || '-'),
                                datasets: [
                                    { label: 'Keterlambatan (Mnt)', data: schoolStats.map(s => s.terlambatMin || 0), backgroundColor: '#f97316' },
                                    { label: 'Cepat Pulang (Mnt)', data: schoolStats.map(s => s.cepatPulangMin || 0), backgroundColor: '#eab308' },
                                    { label: 'Tanpa Ket. (Skala x60)', data: schoolStats.map(s => (s.tanpaKet || 0) * 60), backgroundColor: '#ef4444' }
                                ]
                            },
                            options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: false }, y: { beginAtZero: true } } }
                        });
                    }

                    if(ctxPie) {
                        if (currentPieChart) currentPieChart.destroy();
                        let hasData = (totTerlambatMin + totCepatPulangMin + totIzinSakit + totTanpaKet) > 0;
                        let pieData = hasData ? [totTerlambatMin, totCepatPulangMin, totIzinSakit, totTanpaKet] : [0,0,0,1];
                        let pieColor = hasData ? ['#f97316', '#eab308', '#22c55e', '#ef4444'] : ['#e2e8f0','#e2e8f0','#e2e8f0','#e2e8f0'];
                        
                        currentPieChart = new Chart(ctxPie, {
                            type: 'doughnut',
                            data: {
                                labels: ['Keterlambatan (Mnt)', 'Cepat Pulang (Mnt)', 'Izin/Sakit (Hari)', 'Tanpa Ket. (Hari)'],
                                datasets: [{ data: pieData, backgroundColor: pieColor, borderWidth: 0 }]
                            },
                            options: { responsive: true, maintainAspectRatio: true, cutout: '65%', plugins: { legend: { position: 'bottom' } } }
                        });
                    }
                } catch(e) {}
            }, 100);
        }

        // ==========================================
        // MENU DATA PEGAWAI

        function prosesUploadPegawaiCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (!results.data || results.data.length === 0) {
                        Swal.fire('Error', 'File CSV kosong atau format tidak sesuai.', 'error');
                        return;
                    }

                    let ditolakNIP = [];
                    let diterimaCount = 0;

                    results.data.forEach(row => {
                        let nip = String(row['nip'] || row['NIP'] || '').trim();
                        let nama = String(row['name'] || row['nama'] || row['Nama'] || row['Nama Pegawai'] || '').trim();
                        let sekolah = String(row['school_name'] || row['sekolah'] || row['Sekolah'] || '').trim();
                        let photoUploaded = row['photo_uploaded'] || 'False';

                        if (!nip || nip === '-' || !nama) return;

                        let exists = dummyPegawai.some(p => String(p.nip).trim() === nip);

                        if (exists) {
                            ditolakNIP.push({ nip: nip, nama: nama });
                        } else {
                            dummyPegawai.push({
                                id: Date.now() + Math.random(),
                                nip: nip,
                                nama: nama,
                                sekolah: sekolah,
                                photo_uploaded: photoUploaded
                            });
                            diterimaCount++;
                        }
                    });

                    if (ditolakNIP.length > 0) {
                        let contohNip = ditolakNIP.slice(0, 5).map(x => `${x.nip} (${x.nama})`).join('<br>');
                        let sisaDitolak = ditolakNIP.length > 5 ? `<br><i>...dan ${ditolakNIP.length - 5} data lainnya.</i>` : '';

                        Swal.fire({
                            icon: 'warning',
                            title: 'Peringatan NIP Ganda!',
                            html: `<div class="text-left text-xs text-slate-700">
                                <p class="font-bold text-emerald-600 mb-1">✔ ${diterimaCount} Pegawai baru berhasil ditambahkan.</p>
                                <p class="font-bold text-red-600 mb-2">✖ ${ditolakNIP.length} Pegawai tertolak karena NIP sudah terdaftar:</p>
                                <div class="bg-slate-100 p-2 rounded border border-slate-300 font-mono text-[11px] max-h-36 overflow-y-auto">${contohNip}${sisaDitolak}</div>
                            </div>`,
                            confirmButtonColor: '#3b82f6'
                        });
                    } else {
                        Swal.fire('Berhasil!', `${diterimaCount} Data Pegawai ASN berhasil diimpor.`, 'success');
                    }

                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run.simpanDataPegawaiKeSheet(dummyPegawai);
                    }

                    renderDataPegawai(document.getElementById('content-area'));
                },
                error: function() {
                    Swal.fire('Error', 'Gagal memproses file CSV Pegawai.', 'error');
                }
            });

            event.target.value = '';
        }

        function terapkanFilterAbsen() {
            const filterSekolahVal = document.getElementById('filterSekolah') ? document.getElementById('filterSekolah').value : "ALL";
            const filterTglVal = document.getElementById('filterTanggalAbsen') ? document.getElementById('filterTanggalAbsen').value : "ALL";
            const filterBlnVal = document.getElementById('filterBulanAbsen') ? parseInt(document.getElementById('filterBulanAbsen').value, 10) : (new Date().getMonth() + 1);
            const filterThnVal = document.getElementById('filterTahunAbsen') ? parseInt(document.getElementById('filterTahunAbsen').value, 10) : new Date().getFullYear();

            const tbody = document.getElementById('bodyAbsen');
            const labelPeriode = document.getElementById('labelPeriodeAbsen');
            if(!tbody) return;

            let namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

            let isHarian = (filterTglVal !== "ALL");
            if (labelPeriode) {
                if (isHarian) {
                    labelPeriode.innerText = `Rekap Harian: Tanggal ${filterTglVal} ${namaBulan[filterBlnVal - 1]} ${filterThnVal}`;
                } else {
                    labelPeriode.innerText = `Rekap Bulanan: ${namaBulan[filterBlnVal - 1]} ${filterThnVal}`;
                }
            }

            let hkOtomatis = isHarian ? 1 : hitungHariKerjaBulanIni(filterThnVal, filterBlnVal);
            let dataTampil = [];

            let masterDaftar = [...dummyPegawai];

            Object.values(storeLogHarian).forEach(log => {
                let exists = masterDaftar.some(p => String(p.nip).trim() === String(log.nip).trim());
                if (!exists) {
                    masterDaftar.push({
                        nip: log.nip,
                        nama: log.nama,
                        sekolah: log.sekolah
                    });
                }
            });

            masterDaftar.forEach(peg => {
                let nipStr = String(peg.nip).trim();
                let matchSekolah = dummySekolah.find(s => s.nama.toUpperCase().includes((peg.sekolah || '').toUpperCase()));
                let idSekolahVal = matchSekolah ? matchSekolah.id : (peg.sekolahId || "ALL");

                if (isHarian) {
                    let targetDay = parseInt(filterTglVal, 10);
                    let targetKey = `${nipStr}_${filterThnVal}-${filterBlnVal}-${targetDay}`;
                    let logMatch = storeLogHarian[targetKey];

                    let hadirVal = logMatch ? (logMatch.hadir || 0) : 0;
                    let izinVal = logMatch ? (logMatch.izinSakit || 0) : 0;
                    let telatVal = logMatch ? (logMatch.terlambatMin || 0) : 0;
                    let cptVal = logMatch ? (logMatch.cepatPulangMin || 0) : 0;
                    let alpaVal = (hadirVal === 0 && izinVal === 0) ? 1 : 0;

                    dataTampil.push({
                        nama: peg.nama, nip: peg.nip, sekolah: peg.sekolah, sekolahId: idSekolahVal,
                        hariKerja: 1, hadir: hadirVal, terlambatMin: telatVal, cepatPulangMin: cptVal, izinSakit: izinVal, tanpaKet: alpaVal
                    });
                } else {
                    let totHadir = 0, totIzin = 0, totTelat = 0, totCpt = 0;

                    Object.values(storeLogHarian).forEach(log => {
                        if (String(log.nip).trim() === nipStr && log.yyyy === filterThnVal && log.mm === filterBlnVal) {
                            totHadir += log.hadir || 0;
                            totIzin += log.izinSakit || 0;
                            totTelat += log.terlambatMin || 0;
                            totCpt += log.cepatPulangMin || 0;
                        }
                    });

                    if (totIzin > hkOtomatis) totIzin = hkOtomatis;
                    let totalTercatat = totHadir + totIzin;
                    let alpaVal = hkOtomatis - totalTercatat;
                    if (alpaVal < 0) alpaVal = 0;

                    dataTampil.push({
                        nama: peg.nama, nip: peg.nip, sekolah: peg.sekolah, sekolahId: idSekolahVal,
                        hariKerja: hkOtomatis, hadir: totHadir, terlambatMin: totTelat, cepatPulangMin: totCpt, izinSakit: totIzin, tanpaKet: alpaVal
                    });
                }
            });

            if (filterSekolahVal !== "ALL") {
                let sekolahObj = dummySekolah.find(s => String(s.id) === String(filterSekolahVal));
                let nmSekolah = sekolahObj ? sekolahObj.nama.toUpperCase() : "";
                
                dataTampil = dataTampil.filter(a => 
                    String(a.sekolahId) === String(filterSekolahVal) || 
                    String(a.sekolah).toUpperCase().includes(nmSekolah)
                );
            }

            if(dataTampil.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-slate-500">Kosong. Silakan unggah Data Pegawai atau Log Absensi.</td></tr>`;
                return;
            }

            tbody.innerHTML = dataTampil.map((a, i) => {
                let nmSekolah = a.sekolah || (dummySekolah.find(s => String(s.id) === String(a.sekolahId))?.nama || '-');
                return `
                <tr class="border-b border-slate-100 hover:bg-slate-50 text-sm">
                    <td class="p-3 text-center text-slate-500 font-semibold">${i+1}</td>
                    <td class="p-3 font-semibold text-slate-800">${a.nama}</td>
                    <td class="p-3 text-slate-500 font-mono text-xs">${a.nip}</td>
                    <td class="p-3 text-slate-600">${nmSekolah}</td>
                    <td class="p-3 text-center font-bold text-indigo-600 bg-indigo-50/50">${a.hariKerja} Hari</td>
                    <td class="p-3 text-center font-bold text-blue-600">${a.hadir || 0}</td>
                    <td class="p-3 text-center font-bold text-orange-600">${a.terlambatMin || 0} Mnt</td>
                    <td class="p-3 text-center font-bold text-yellow-600">${a.cepatPulangMin || 0} Mnt</td>
                    <td class="p-3 text-center font-bold text-emerald-600">${a.izinSakit || 0}</td>
                    <td class="p-3 text-center font-bold text-red-600">${a.tanpaKet || 0}</td>
                </tr>`
            }).join('');

            dummyAbsensi = dataTampil;
        }

        function prosesUploadLogMingguan(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {raw: false});

                    if (jsonData.length > 0) {
                        let riwayatTemp = {}; 

                        jsonData.forEach(row => {
                            let nipPegawai = String(row['NIP'] || row['nip'] || '-').trim();
                            let namaPegawai = String(row['nama'] || row['Nama'] || row['NAMA'] || row['Nama Pegawai'] || '-').trim();
                            if (nipPegawai === '-' || nipPegawai === '') return;

                            let namaSekolah = String(row['sekolah'] || row['Sekolah'] || row['SEKOLAH'] || '-').trim();
                            let rawTanggal = String(row['tanggal'] || row['Tanggal'] || '').trim();
                            let jam = String(row['jam'] || row['Jam'] || '').trim();
                            let status = String(row['status'] || row['Status'] || '').trim().toUpperCase();

                            let dateObj = parseTanggalKeObject(rawTanggal);
                            if(!dateObj) return;

                            let keyUnik = `${nipPegawai}_${dateObj.yyyy}-${dateObj.mm}-${dateObj.dd}`;

                            if (!riwayatTemp[keyUnik]) {
                                riwayatTemp[keyUnik] = {
                                    nip: nipPegawai, nama: namaPegawai, sekolah: namaSekolah,
                                    yyyy: dateObj.yyyy, mm: dateObj.mm, dd: dateObj.dd,
                                    datang: null, pulang: null, izinSakit: 0
                                };
                            }

                            if (status === 'DATANG' && riwayatTemp[keyUnik].datang === null) {
                                riwayatTemp[keyUnik].datang = jam;
                            } else if (status === 'PULANG' && riwayatTemp[keyUnik].pulang === null) {
                                riwayatTemp[keyUnik].pulang = jam;
                            } else if ((status === 'IZIN' || status === 'SAKIT' || status === 'DL' || status === 'CUTI') && riwayatTemp[keyUnik].izinSakit === 0) {
                                riwayatTemp[keyUnik].izinSakit = 1;
                            }
                        });

                        Object.keys(riwayatTemp).forEach(key => {
                            let record = riwayatTemp[key];
                            let hadirBaru = (record.datang !== null || record.pulang !== null) ? 1 : 0;
                            let terlambatBaru = 0, cptPulangBaru = 0;

                            if (record.datang !== null && record.datang > "08:00:00") {
                                let [jamD, mntD] = record.datang.split(':').map(Number);
                                terlambatBaru = Math.max(0, ((jamD * 60) + (mntD || 0)) - 480);
                            }
                            if (record.pulang !== null && record.pulang < "16:00:00") {
                                let [jamP, mntP] = record.pulang.split(':').map(Number);
                                cptPulangBaru = Math.max(0, 960 - ((jamP * 60) + (mntP || 0)));
                            }

                            storeLogHarian[key] = {
                                nip: record.nip, nama: record.nama, sekolah: record.sekolah,
                                yyyy: record.yyyy, mm: record.mm, dd: record.dd,
                                hadir: hadirBaru, terlambatMin: terlambatBaru, cepatPulangMin: cptPulangBaru, izinSakit: record.izinSakit
                            };
                        });

                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run.simpanRekapAbsenKeSheet(storeLogHarian);
                        }
                        terapkanFilterAbsen();
                        Swal.fire('Berhasil!', 'Log absensi diunggah & direkap secara akurat tanpa penggandaan data.', 'success');
                    }
                } catch(err) {
                    Swal.fire('Error', 'Gagal memproses file log CSV.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        function downloadExcelAbsen() {
            const tbody = document.getElementById('bodyAbsen');
            if(!tbody || dummyAbsensi.length === 0) {
                Swal.fire('Kosong', 'Tidak ada data rekap untuk di-export.', 'warning');
                return;
            }

            const filterTglVal = document.getElementById('filterTanggalAbsen') ? document.getElementById('filterTanggalAbsen').value : "ALL";
            const filterBlnVal = document.getElementById('filterBulanAbsen') ? parseInt(document.getElementById('filterBulanAbsen').value, 10) : (new Date().getMonth() + 1);
            const filterThnVal = document.getElementById('filterTahunAbsen') ? parseInt(document.getElementById('filterTahunAbsen').value, 10) : new Date().getFullYear();

            let namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            let isHarian = (filterTglVal !== "ALL");

            let dataExport = dummyAbsensi.map((a, i) => ({
                'No': i + 1,
                'Nama Pegawai': a.nama,
                'NIP': a.nip,
                'Sekolah': a.sekolah || '-',
                'Hari Kerja': a.hariKerja,
                'Hadir': a.hadir || 0,
                'Keterlambatan (Mnt)': a.terlambatMin || 0,
                'Cepat Pulang (Mnt)': a.cepatPulangMin || 0,
                'Izin/Sakit/DL': a.izinSakit || 0,
                'Tanpa Keterangan (Hari)': a.tanpaKet || 0
            }));

            let namaFile = isHarian 
                ? `Rekap_Absen_Harian_Tgl_${filterTglVal}_${namaBulan[filterBlnVal - 1]}_${filterThnVal}.xlsx`
                : `Rekap_Absen_Bulanan_${namaBulan[filterBlnVal - 1]}_${filterThnVal}.xlsx`;

            let ws = XLSX.utils.json_to_sheet(dataExport);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, isHarian ? "Rekap Harian" : "Rekap Bulanan");
            XLSX.writeFile(wb, namaFile);
        }

        function renderDataSekolah(container) {
            if(!container) return;
            let trs = dummySekolah.map((s, i) => `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="p-3 text-sm text-center">${i+1}</td>
                    <td class="p-3 text-sm font-semibold">${s.nama}</td>
                    <td class="p-3 text-sm text-slate-600">${s.npsn || '-'}</td>
                    <td class="p-3 text-sm">${s.kepsek || '-'}</td>
                    <td class="p-3 text-sm text-slate-500">${s.nip || '-'}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="glass-card p-6">
                    <h3 class="font-bold text-slate-700 mb-4">Daftar Sekolah Cabdin Wil. IV</h3>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600">
                                <th class="p-3 text-sm text-center w-12">No</th>
                                <th class="p-3 text-sm">Nama Sekolah</th>
                                <th class="p-3 text-sm">NPSN</th>
                                <th class="p-3 text-sm">Kepala Sekolah</th>
                                <th class="p-3 text-sm">NIP Kepsek</th>
                            </tr>
                        </thead>
                        <tbody>${trs}</tbody>
                    </table>
                </div>
            `;
        }

        function renderLaporan(container) {
            if(!container) return;
            container.innerHTML = `<div class="glass-card p-6"><h3 class="font-bold text-slate-700">Laporan Indisipliner</h3><p class="text-sm text-slate-500 mt-2">Menampilkan data indisipliner pegawai berdasarkan akumulasi absensi bulanan.</p></div>`;
        }
    </script>
</body>
</html>
