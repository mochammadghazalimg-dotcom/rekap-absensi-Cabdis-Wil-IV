<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Rekap Absensi & Indisipliner - Cabdin Wil IV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .sidebar-link { transition: all 0.3s ease; cursor: pointer; }
        .sidebar-link:hover, .sidebar-link.active { background-color: #1e40af; border-left: 4px solid #60a5fa; }
        .glass-card { background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 12px; }
        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: #f1f5f9; }
        .card-certificate { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); border: 3px solid #f59e0b; }
    </style>
</head>
<body class="text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigasi -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl z-20">
        <div class="p-6 flex flex-col items-center justify-center border-b border-slate-700 text-center">
            <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center mb-2 drop-shadow-md">
                <i class="fa-solid fa-building-flag text-2xl text-blue-600"></i>
            </div>
            <h1 class="text-lg font-bold tracking-wider uppercase text-blue-400">Cabdin Wil. IV</h1>
            <p class="text-xs text-slate-400">Sistem Presensi Terpadu</p>
        </div>
        <nav class="flex-1 mt-6">
            <ul class="space-y-1">
                <li><a onclick="switchView('dashboard')" id="nav-dashboard" class="sidebar-link active flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-chart-line w-6 text-center mr-3"></i> Dashboard Utama</a></li>
                <li><a onclick="switchView('dataPegawai')" id="nav-dataPegawai" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-users w-6 text-center mr-3"></i> Data Pegawai</a></li>
                <li><a onclick="switchView('dataSekolah')" id="nav-dataSekolah" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-school w-6 text-center mr-3"></i> Data Sekolah</a></li>
                <li><a onclick="switchView('rekapAbsen')" id="nav-rekapAbsen" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-calendar-check w-6 text-center mr-3"></i> Rekap Absen</a></li>
                <li><a onclick="switchView('laporanIndisipliner')" id="nav-laporanIndisipliner" class="sidebar-link flex items-center py-3 px-6 text-sm font-medium"><i class="fa-solid fa-user-xmark w-6 text-center mr-3"></i> Lap. Indisipliner</a></li>
            </ul>
        </nav>
        <div class="p-4 border-t border-slate-700 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold">AC</div>
            <div>
                <p class="text-sm font-semibold">Admin Cabdin</p>
                <p class="text-xs text-green-400"><i class="fa-solid fa-circle text-[8px] mr-1"></i> Online</p>
            </div>
        </div>
    </aside>

    <!-- Content Area -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative bg-slate-50">
        <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10 px-8 py-4 flex justify-between items-center">
            <h2 id="page-title" class="text-xl font-bold text-slate-800">Dashboard Utama</h2>
            <div class="flex items-center gap-4 text-sm text-slate-500 font-medium">
                <i class="fa-regular fa-clock text-blue-500"></i>
                <span id="current-time">Waktu memuat...</span>
            </div>
        </header>
        <div id="content-area" class="p-8 w-full h-full"></div>
    </main>

    <script>
        let LIBUR_NASIONAL = []; 
        let defaultSekolah = [
            { id: 1, nama: "SMKN 6 WAJO", npsn: "40303160", kepsek: "Drs. Muhammad, M.Pd", nip: "196801011995031001" },
            { id: 2, nama: "SMAN 9 WAJO", npsn: "40303161", kepsek: "Andi Ahmad, S.Pd", nip: "197202022000031002" },
            { id: 3, nama: "SMAN 3 WAJO", npsn: "40303162", kepsek: "Siti Rahma, M.Si", nip: "197503032005012003" }
        ];

        let dummySekolah = [...defaultSekolah];
        let dummyAbsensi = [];      
        let dummyPegawai = []; // MASTER DATA PEGAWAI ASN
        let currentChart = null;
        let currentPieChart = null;

        function updateTime() {
            try {
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                const timeEl = document.getElementById('current-time');
                if(timeEl) timeEl.innerText = now.toLocaleDateString('id-ID', options);
            } catch (e) {}
        }
        setInterval(updateTime, 30000);

        function muatKalenderLiburOtomatis() {
            let tahun = new Date().getFullYear();
            if(typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run.withSuccessHandler(function(data) {
                    if (data && Array.isArray(data)) LIBUR_NASIONAL = data;
                }).getLiburOtomatisDariGoogle(tahun);
            }
        }

        window.onload = function() {
            updateTime();
            muatKalenderLiburOtomatis();
            
            const contentArea = document.getElementById('content-area');
            if (contentArea) {
                contentArea.innerHTML = '<div class="text-center mt-20 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-600"></i><br>Menghubungkan ke Database Google Spreadsheet...</div>';
            }

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function(db) {
                        if (db) {
                            if (db.sekolah && db.sekolah.length > 0) dummySekolah = db.sekolah;
                            if (db.absensi && db.absensi.length > 0) dummyAbsensi = db.absensi;
                            if (db.pegawai && db.pegawai.length > 0) dummyPegawai = db.pegawai;
                        }
                        switchView('dashboard');
                    })
                    .withFailureHandler(function(err) {
                        console.warn("Koneksi Spreadsheet ditangguhkan, memuat antarmuka lokal:", err);
                        switchView('dashboard');
                    })
                    .ambilSemuaDataFromSheet();
            } else {
                switchView('dashboard');
            }
        };

        function hitungHariKerjaBulanIni(year, month) {
            let totalWorkdays = 0;
            let daysInMonth = new Date(year, month, 0).getDate();
            for (let d = 1; d <= daysInMonth; d++) {
                let dateObj = new Date(year, month - 1, d);
                let dayOfWeek = dateObj.getDay();
                let yyyy = dateObj.getFullYear();
                let mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                let dd = String(dateObj.getDate()).padStart(2, '0');
                let dateString = `${yyyy}-${mm}-${dd}`;
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && !LIBUR_NASIONAL.includes(dateString)) { 
                    totalWorkdays++;
                }
            }
            return totalWorkdays; 
        }

        function switchView(viewId) {
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            const activeNav = document.getElementById('nav-' + viewId);
            if(activeNav) activeNav.classList.add('active');

            const contentArea = document.getElementById('content-area');
            const pageTitle = document.getElementById('page-title');

            if (viewId === 'dashboard') { pageTitle.innerText = "Dashboard Utama"; renderDashboard(contentArea); }
            else if (viewId === 'dataPegawai') { pageTitle.innerText = "Data Pegawai ASN"; renderDataPegawai(contentArea); }
            else if (viewId === 'dataSekolah') { pageTitle.innerText = "Data Sekolah"; renderDataSekolah(contentArea); }
            else if (viewId === 'rekapAbsen') { pageTitle.innerText = "Rekap Absen Sekolah"; renderRekapAbsen(contentArea); }
            else if (viewId === 'laporanIndisipliner') { pageTitle.innerText = "Laporan Indisipliner"; renderLaporan(contentArea); }
        }

        function goToRekapAbsen(sekolahId) {
            switchView('rekapAbsen');
            setTimeout(() => {
                const filterSelect = document.getElementById('filterSekolah');
                if(filterSelect) { 
                    filterSelect.value = sekolahId; 
                    terapkanFilterAbsen(); 
                }
            }, 100);
        }

        // ==========================================
        // MENU 1: DATA PEGAWAI (MASTER DATA)
        // ==========================================
        function renderDataPegawai(container) {
            if(!container) return;
            
            let sekolahOptions = `<option value="ALL">Semua Sekolah</option>` + 
                dummySekolah.map(s => `<option value="${s.nama}">${s.nama}</option>`).join('');

            container.innerHTML = `
                <div class="glass-card p-6">
                    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
                        <div>
                            <h3 class="font-bold text-slate-700 text-lg">Master Data Pegawai ASN</h3>
                            <p class="text-xs text-slate-500">Basis data acuan pegawai untuk presensi seluruh sekolah Cabdin Wil. IV</p>
                        </div>
                        <div class="flex gap-2 flex-wrap items-center">
                            <select id="filterSekolahPegawai" onchange="renderTabelPegawai()" class="p-2 border border-slate-300 rounded text-sm min-w-[200px]">
                                ${sekolahOptions}
                            </select>
                            <input type="file" id="uploadCSVPegawai" accept=".csv" class="hidden" onchange="prosesUploadPegawaiCSV(event)" />
                            <button onclick="document.getElementById('uploadCSVPegawai').click()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold flex items-center gap-2">
                                <i class="fa-solid fa-file-csv"></i> Unggah CSV Pegawai
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 text-xs uppercase font-bold">
                                    <th class="p-3 text-center w-12 border-b">No</th>
                                    <th class="p-3 border-b">NIP</th>
                                    <th class="p-3 border-b">Nama Pegawai</th>
                                    <th class="p-3 border-b">Sekolah</th>
                                    <th class="p-3 text-center border-b">Foto Acuan</th>
                                </tr>
                            </thead>
                            <tbody id="bodyPegawai"></tbody>
                        </table>
                    </div>
                </div>
            `;
            renderTabelPegawai();
        }

        function renderTabelPegawai() {
            const filterVal = document.getElementById('filterSekolahPegawai') ? document.getElementById('filterSekolahPegawai').value : "ALL";
            const tbody = document.getElementById('bodyPegawai');
            if(!tbody) return;

            let filtered = dummyPegawai;
            if (filterVal !== "ALL") {
                filtered = dummyPegawai.filter(p => (p.sekolah || '').toUpperCase().includes(filterVal.toUpperCase()));
            }

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-500 text-sm">Belum ada data pegawai. Silakan unggah CSV Data Pegawai.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((p, i) => `
                <tr class="border-b border-slate-100 hover:bg-slate-50 text-sm">
                    <td class="p-3 text-center text-slate-500">${i+1}</td>
                    <td class="p-3 font-semibold text-slate-800">${p.nip}</td>
                    <td class="p-3 font-semibold text-blue-950">${p.nama}</td>
                    <td class="p-3 text-slate-600">${p.sekolah || '-'}</td>
                    <td class="p-3 text-center">
                        <span class="px-2 py-0.5 text-[11px] font-semibold rounded-full ${p.photo_uploaded === 'True' || p.photo_uploaded === true || p.photo_uploaded === 'true' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">
                            ${p.photo_uploaded === 'True' || p.photo_uploaded === true || p.photo_uploaded === 'true' ? 'Tersedia' : 'Belum Ada'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function prosesUploadPegawaiCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (!results.data || results.data.length === 0) {
                        Swal.fire('Error', 'File CSV kosong atau format tidak sesuai.', 'error');
                        return;
                    }

                    let ditolakNIP = [];
                    let diterimaCount = 0;

                    results.data.forEach(row => {
                        let nip = String(row['nip'] || row['NIP'] || '').trim();
                        let nama = String(row['name'] || row['nama'] || row['Nama'] || row['Nama Pegawai'] || '').trim();
                        let sekolah = String(row['school_name'] || row['sekolah'] || row['Sekolah'] || '').trim();
                        let photoUploaded = row['photo_uploaded'] || 'False';

                        if (!nip || nip === '-' || !nama) return;

                        // Pengecekan NIP Ganda
                        let exists = dummyPegawai.some(p => String(p.nip).trim() === nip);

                        if (exists) {
                            ditolakNIP.push({ nip: nip, nama: nama });
                        } else {
                            dummyPegawai.push({
                                id: Date.now() + Math.random(),
                                nip: nip,
                                nama: nama,
                                sekolah: sekolah,
                                photo_uploaded: photoUploaded
                            });
                            diterimaCount++;
                        }
                    });

                    // Notifikasi jika ada data tertolak
                    if (ditolakNIP.length > 0) {
                        let contohNip = ditolakNIP.slice(0, 5).map(x => `${x.nip} (${x.nama})`).join('<br>');
                        let sisaDitolak = ditolakNIP.length > 5 ? `<br><i>...dan ${ditolakNIP.length - 5} data lainnya.</i>` : '';

                        Swal.fire({
                            icon: 'warning',
                            title: 'Peringatan NIP Ganda!',
                            html: `<div class="text-left text-xs text-slate-700">
                                <p class="font-bold text-emerald-600 mb-1">✔ ${diterimaCount} Pegawai baru berhasil ditambahkan.</p>
                                <p class="font-bold text-red-600 mb-2">✖ ${ditolakNIP.length} Pegawai tertolak karena NIP sudah terdaftar:</p>
                                <div class="bg-slate-100 p-2 rounded border border-slate-300 font-mono text-[11px] max-h-36 overflow-y-auto">${contohNip}${sisaDitolak}</div>
                            </div>`,
                            confirmButtonColor: '#3b82f6'
                        });
                    } else {
                        Swal.fire('Berhasil!', `${diterimaCount} Data Pegawai ASN berhasil diimpor.`, 'success');
                    }

                    // Simpan ke spreadsheet jika terhubung
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run.simpanDataPegawaiKeSheet(dummyPegawai);
                    }

                    renderDataPegawai(document.getElementById('content-area'));
                },
                error: function(err) {
                    Swal.fire('Error', 'Gagal memproses file CSV Pegawai.', 'error');
                }
            });

            event.target.value = '';
        }

        function renderDashboard(container) {
            if(!container) return;
            let totalPegawai = dummyPegawai.length > 0 ? dummyPegawai.length : (dummyAbsensi.length || 0);
            let totalSekolah = dummySekolah.length || 0;
            let totTerlambatMin = 0, totCepatPulangMin = 0, totIzinSakit = 0, totTanpaKet = 0;
            
            // 1. HITUNG JUMLAH ASN & STATISTIK PER SEKOLAH
            let schoolStats = dummySekolah.map(s => {
                // Cari jumlah ASN sekolah ini dari Master Pegawai
                let pegSekolah = dummyPegawai.filter(p => (p.sekolah || '').toUpperCase().includes(s.nama.toUpperCase()));
                let totalASN = pegSekolah.length;

                // Jika Master Pegawai belum terisi, hitung dari data absensi yang ada
                if (totalASN === 0) {
                    totalASN = dummyAbsensi.filter(a => String(a.sekolahId) === String(s.id) || (a.sekolah || '').toUpperCase().includes(s.nama.toUpperCase())).length;
                }
                
                // Mencegah pembagian dengan nol (DIV/0)
                if (totalASN === 0) totalASN = 1;

                return { 
                    id: s.id, 
                    nama: s.nama, 
                    totalASN: totalASN,
                    terlambatMin: 0, 
                    cepatPulangMin: 0, 
                    tanpaKet: 0, 
                    hadir: 0,
                    avgTerlambatMin: 0,
                    avgCepatPulangMin: 0,
                    avgTanpaKet: 0
                };
            });

            // Akumulasi total pelanggaran
            dummyAbsensi.forEach(absen => {
                totTerlambatMin += parseInt(absen.terlambatMin) || 0;
                totCepatPulangMin += parseInt(absen.cepatPulangMin) || 0;
                totIzinSakit += parseInt(absen.izinSakit) || 0;
                totTanpaKet += parseInt(absen.tanpaKet) || 0;

                let s = schoolStats.find(x => String(x.id) === String(absen.sekolahId) || x.nama.toUpperCase().includes((absen.sekolah || '').toUpperCase()));
                if(s) {
                    s.terlambatMin += parseInt(absen.terlambatMin) || 0;
                    s.cepatPulangMin += parseInt(absen.cepatPulangMin) || 0;
                    s.tanpaKet += parseInt(absen.tanpaKet) || 0;
                    s.hadir += parseInt(absen.hadir) || 0;
                }
            });

            // 2. HITUNG RATA-RATA PER ASN
            schoolStats.forEach(s => {
                s.avgTanpaKet = parseFloat((s.tanpaKet / s.totalASN).toFixed(1));
                s.avgTerlambatMin = Math.round(s.terlambatMin / s.totalASN);
                s.avgCepatPulangMin = Math.round(s.cepatPulangMin / s.totalASN);
            });

            // 3. PEMERINGKATAN ADIL BERDASARKAN RATA-RATA PER ASN
            let top5AlpaSekolah = [...schoolStats].sort((a,b) => b.avgTanpaKet - a.avgTanpaKet).slice(0, 5);
            let top5TerlambatSekolah = [...schoolStats].sort((a,b) => b.avgTerlambatMin - a.avgTerlambatMin).slice(0, 5);
            let top5CepatPulangSekolah = [...schoolStats].sort((a,b) => b.avgCepatPulangMin - a.avgCepatPulangMin).slice(0, 5);

            let best5AlpaSekolah = [...schoolStats].sort((a,b) => a.avgTanpaKet - b.avgTanpaKet).slice(0, 5);
            let best5TerlambatSekolah = [...schoolStats].sort((a,b) => a.avgTerlambatMin - b.avgTerlambatMin).slice(0, 5);
            let best5CepatPulangSekolah = [...schoolStats].sort((a,b) => a.avgCepatPulangMin - b.avgCepatPulangMin).slice(0, 5);

            let top5ASN = [...dummyAbsensi].sort((a, b) => {
                let tanpaKetA = parseInt(a.tanpaKet) || 0; let tanpaKetB = parseInt(b.tanpaKet) || 0;
                let telatA = parseInt(a.terlambatMin) || 0; let telatB = parseInt(b.terlambatMin) || 0;
                let cepatA = parseInt(a.cepatPulangMin) || 0; let cepatB = parseInt(b.cepatPulangMin) || 0;
                let hadirA = parseInt(a.hadir) || 0; let hadirB = parseInt(b.hadir) || 0;

                if (tanpaKetA !== tanpaKetB) return tanpaKetA - tanpaKetB; 
                if (telatA !== telatB) return telatA - telatB;             
                if (cepatA !== cepatB) return cepatA - cepatB;             
                return hadirB - hadirA;                                    
            }).slice(0, 5);

            const bulanIni = new Date().toLocaleString('id-ID', { month: 'long', year: 'numeric' });

            container.innerHTML = `
                <!-- RINGKASAN METRIK -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="glass-card p-6 border-l-4 border-blue-500 flex items-center">
                        <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4"><i class="fa-solid fa-school text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Total Sekolah</p><p class="text-2xl font-bold text-slate-800">${totalSekolah}</p></div>
                    </div>
                    <div class="glass-card p-6 border-l-4 border-emerald-500 flex items-center">
                        <div class="p-3 rounded-full bg-emerald-100 text-emerald-600 mr-4"><i class="fa-solid fa-users text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Pegawai Terekam</p><p class="text-2xl font-bold text-slate-800">${totalPegawai}</p></div>
                    </div>
                    <div class="glass-card p-6 border-l-4 border-orange-500 flex items-center">
                        <div class="p-3 rounded-full bg-orange-100 text-orange-600 mr-4"><i class="fa-solid fa-clock text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Total Keterlambatan</p><p class="text-2xl font-bold text-orange-600">${totTerlambatMin} <span class="text-xs font-normal">Menit</span></p></div>
                    </div>
                    <div class="glass-card p-6 border-l-4 border-red-500 flex items-center">
                        <div class="p-3 rounded-full bg-red-100 text-red-600 mr-4"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
                        <div><p class="text-sm text-slate-500 font-medium">Tanpa Keterangan</p><p class="text-2xl font-bold text-red-600">${totTanpaKet} <span class="text-xs font-normal">Hari</span></p></div>
                    </div>
                </div>

                <!-- TOP 5 ASN TELADAN -->
                <div class="mb-8">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg text-amber-700 flex items-center">
                            <i class="fa-solid fa-certificate text-yellow-500 text-xl mr-2"></i> Top 5 ASN Teladan Presensi (${bulanIni})
                        </h3>
                        <span class="text-xs font-semibold bg-amber-100 text-amber-800 px-3 py-1 rounded-full"><i class="fa-solid fa-camera mr-1"></i> Klik ASN untuk Download Kartu Sertifikat</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        ${top5ASN.length > 0 ? top5ASN.map((asn, i) => `
                            <div onclick="tampilkanKartuASN('${encodeURIComponent(JSON.stringify(asn))}')" class="glass-card bg-gradient-to-b from-amber-50 to-white border border-amber-200 p-4 rounded-xl flex flex-col items-center text-center clickable-row hover-card relative overflow-hidden">

        function prosesUploadSekolah(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {raw: false});
                    
                    if (jsonData.length > 0) {
                        let count = 0;
                        jsonData.forEach(row => {
                        let keys = Object.keys(row);
                            
                            let keyNama = keys.find(k => k.trim().toLowerCase() === 'nama sekolah' || k.trim().toLowerCase() === 'sekolah');
                            let nama = keyNama ? String(row[keyNama]).trim() : '';
                            if(!nama) return;

                            let keyNPSN = keys.find(k => k.trim().toLowerCase() === 'npsn');
                            let npsn = keyNPSN ? String(row[keyNPSN]).trim() : '-';

                            let keyKepsek = keys.find(k => k.trim().toLowerCase().includes('kepala') || k.trim().toLowerCase().includes('kepsek'));
                            let kepsek = keyKepsek ? String(row[keyKepsek]).trim() : '-';

                            let keyNIP = keys.find(k => k.trim().toLowerCase().includes('nip'));
                            let nip = keyNIP ? String(row[keyNIP]).trim() : '-';

                            let exist = dummySekolah.find(s => s.nama.toUpperCase() === nama.toUpperCase());
                            if(!exist) {
                                dummySekolah.push({ id: Date.now() + Math.random(), nama: nama, npsn: npsn, kepsek: kepsek, nip: nip });
                                count++;
                            }
                        });

                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run.simpanDataSekolahKeSheet(dummySekolah);
                        }
                        renderDataSekolah(document.getElementById('content-area'));
                        Swal.fire('Berhasil!', `${count} sekolah baru berhasil diunggah.`, 'success');
                    }
                } catch(err) {
                    Swal.fire('Error', 'Gagal memproses file sekolah.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        // ==========================================
        // SINKRONISASI MASTER PEGAWAI KE REKAP ABSENSI
        // ==========================================
        function sinkronkanMasterKeAbsensi() {
            let tahunSekarang = new Date().getFullYear();
            let bulanSekarang = new Date().getMonth() + 1; 
            let hariKerjaAktual = hitungHariKerjaBulanIni(tahunSekarang, bulanSekarang);

            dummyPegawai.forEach(peg => {
                let matchSekolah = dummySekolah.find(s => s.nama.toUpperCase().includes((peg.sekolah || '').toUpperCase()));
                let idSekolahVal = matchSekolah ? matchSekolah.id : "ALL";

                let indexAbsen = dummyAbsensi.findIndex(a => String(a.nip).trim() === String(peg.nip).trim());
                if (indexAbsen === -1) {
                    // Jika pegawai dari Master Data belum ada di dummyAbsensi, masukkan sebagai 0 Hadir (Tanpa Keterangan)
                    dummyAbsensi.push({
                        id: Date.now() + Math.random(),
                        nama: peg.nama,
                        nip: peg.nip,
                        sekolah: peg.sekolah,
                        sekolahId: idSekolahVal,
                        hariKerja: hariKerjaAktual,
                        hadir: 0,
                        terlambatMin: 0,
                        cepatPulangMin: 0,
                        izinSakit: 0,
                        tanpaKet: hariKerjaAktual
                    });
                } else {
                    // Update nama & sekolah terbaru dari Master jika ada perubahan
                    dummyAbsensi[indexAbsen].nama = peg.nama;
                    dummyAbsensi[indexAbsen].sekolah = peg.sekolah;
                    if(idSekolahVal !== "ALL") dummyAbsensi[indexAbsen].sekolahId = idSekolahVal;
                }
            });
        }

        // MENU REKAP ABSENSI
        function renderRekapAbsen(container) {
            if(!container) return;
            let options = `<option value="ALL">Semua Sekolah</option>` + dummySekolah.map(s => `<option value="${s.id}">${s.nama}</option>`).join('');

            container.innerHTML = `
                <div class="glass-card p-6 mb-6 flex flex-wrap justify-between items-end bg-blue-50/50 border border-blue-100 gap-4">
                    <div class="flex gap-4 items-end">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Filter Sekolah</label>
                            <select id="filterSekolah" class="p-2 border border-slate-300 rounded text-sm w-48">${options}</select>
                        </div>
                        <button onclick="terapkanFilterAbsen()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-filter mr-2"></i> Filter</button>
                    </div>
                    
                    <div class="flex gap-2 flex-wrap">
                        <input type="file" id="uploadExcelAbsen" accept=".xlsx, .xls, .csv" class="hidden" onchange="prosesUploadLogMingguan(event)" />
                        <button onclick="document.getElementById('uploadExcelAbsen').click()" class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-upload mr-2"></i> Unggah Log (.csv)</button>
                        <button onclick="downloadExcelAbsen()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded text-sm"><i class="fa-solid fa-file-excel mr-2"></i> Export Rekap</button>
                    </div>
                </div>
                
                <div class="glass-card p-6">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-800 text-white">
                                    <th class="p-3 text-sm text-center w-12">No</th>
                                    <th class="p-3 text-sm">Nama Pegawai</th>
                                    <th class="p-3 text-sm">NIP</th>
                                    <th class="p-3 text-sm">Sekolah</th>
                                    <th class="p-3 text-sm text-center bg-indigo-600">Hari Kerja</th>
                                    <th class="p-3 text-sm text-center bg-blue-700">Hadir</th>
                                    <th class="p-3 text-sm text-center bg-orange-600">Keterlambatan</th>
                                    <th class="p-3 text-sm text-center bg-yellow-600">Cepat Pulang</th>
                                    <th class="p-3 text-sm text-center bg-emerald-600">Izin/Sakit/DL</th>
                                    <th class="p-3 text-sm text-center bg-red-600">Tanpa Ket.</th>
                                </tr>
                            </thead>
                            <tbody id="bodyAbsen"></tbody>
                        </table>
                    </div>
                </div>
            `;
            terapkanFilterAbsen();
        }

        function terapkanFilterAbsen() {
            // Pastikan data master pegawai disinkronkan terlebih dahulu
            sinkronkanMasterKeAbsensi();

            const filterVal = document.getElementById('filterSekolah') ? document.getElementById('filterSekolah').value : "ALL";
            const tbody = document.getElementById('bodyAbsen');
            if(!tbody) return;

            let tahunSekarang = new Date().getFullYear();
            let bulanSekarang = new Date().getMonth() + 1; 
            let hariKerjaAktual = hitungHariKerjaBulanIni(tahunSekarang, bulanSekarang);

            // Update hitungan Tanpa Keterangan untuk seluruh pegawai
            dummyAbsensi.forEach(p => {
                p.hariKerja = hariKerjaAktual;
                let totalTercatat = (p.hadir || 0) + (p.izinSakit || 0);
                p.tanpaKet = hariKerjaAktual - totalTercatat;
                if (p.tanpaKet < 0) p.tanpaKet = 0;
            });

            let filtered = dummyAbsensi;
            if (filterVal !== "ALL") {
                let sekolahObj = dummySekolah.find(s => String(s.id) === String(filterVal));
                let nmSekolah = sekolahObj ? sekolahObj.nama.toUpperCase() : "";
                
                filtered = dummyAbsensi.filter(a => 
                    String(a.sekolahId) === String(filterVal) || 
                    String(a.sekolah).toUpperCase().includes(nmSekolah)
                );
            }

            if(filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-slate-500">Kosong. Silakan unggah Data Pegawai atau Log Absensi.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((a, i) => {
                let nmSekolah = a.sekolah || (dummySekolah.find(s => String(s.id) === String(a.sekolahId))?.nama || '-');
                return `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="p-3 text-sm text-center">${i+1}</td>
                    <td class="p-3 text-sm font-semibold">${a.nama}</td>
                    <td class="p-3 text-sm text-slate-500">${a.nip}</td>
                    <td class="p-3 text-sm">${nmSekolah}</td>
                    <td class="p-3 text-sm text-center font-bold text-indigo-600 bg-indigo-50">${hariKerjaAktual} Hari</td>
                    <td class="p-3 text-sm text-center font-bold text-blue-600">${a.hadir || 0}</td>
                    <td class="p-3 text-sm text-center font-bold text-orange-600">${a.terlambatMin || 0}</td>
                    <td class="p-3 text-sm text-center font-bold text-yellow-600">${a.cepatPulangMin || 0}</td>
                    <td class="p-3 text-sm text-center font-bold text-emerald-600">${a.izinSakit || 0}</td>
                    <td class="p-3 text-sm text-center font-bold text-red-600">${a.tanpaKet || 0}</td>
                </tr>`
            }).join('');
        }

        function prosesUploadLogMingguan(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {raw: false});

                    if (jsonData.length > 0) {
                        let riwayatHarian = {}; 

                        // 1. KELOMPOKKAN & FILTER DUPLIKAT BERDASARKAN TANGGAL
                        jsonData.forEach(row => {
                            let nipPegawai = String(row['NIP'] || row['nip'] || '-').trim();
                            let namaPegawai = String(row['nama'] || row['Nama'] || row['NAMA'] || row['Nama Pegawai'] || '-').trim();
                            if (nipPegawai === '-' || nipPegawai === '') return;

                            let namaSekolah = String(row['sekolah'] || row['Sekolah'] || row['SEKOLAH'] || '-').trim();
                            let tanggal = String(row['tanggal'] || row['Tanggal'] || '').trim();
                            let jam = String(row['jam'] || row['Jam'] || '').trim();
                            let status = String(row['status'] || row['Status'] || '').trim().toUpperCase();

                            let key = nipPegawai + "_" + tanggal;

                            if (!riwayatHarian[key]) {
                                riwayatHarian[key] = {
                                    nip: nipPegawai, nama: namaPegawai, sekolah: namaSekolah, tanggal: tanggal,
                                    datang: null, pulang: null, izinSakit: 0
                                };
                            }

                            if (status === 'DATANG' && riwayatHarian[key].datang === null) {
                                riwayatHarian[key].datang = jam;
                            } else if (status === 'PULANG' && riwayatHarian[key].pulang === null) {
                                riwayatHarian[key].pulang = jam;
                            } else if ((status === 'IZIN' || status === 'SAKIT' || status === 'DL' || status === 'CUTI') && riwayatHarian[key].izinSakit === 0) {
                                riwayatHarian[key].izinSakit = 1;
                            }
                        });

                        // 2. HITUNG & MASUKKAN KE REKAP TABEL BERDASARKAN ATURAN ASLI
                        Object.values(riwayatHarian).forEach(record => {
                            let hadirBaru = 0;
                            let terlambatBaru = 0;
                            let cptPulangBaru = 0;

                            if (record.datang !== null || record.pulang !== null) {
                                hadirBaru = 1;
                            }
                            
                            if (record.datang !== null) {
                                if (record.datang > "07:45:00") {
                                    let [jamD, mntD] = record.datang.split(':').map(Number);
                                    terlambatBaru = ((jamD * 60) + mntD) - ((7 * 60) + 45);
                                    if (terlambatBaru < 0) terlambatBaru = 0;
                                }
                            } else if (record.pulang !== null) {
                                terlambatBaru = 495; 
                            }
                            
                            if (record.pulang !== null && record.pulang < "16:00:00") {
                                let [jamP, mntP] = record.pulang.split(':').map(Number);
                                cptPulangBaru = ((16 * 60) + 0) - ((jamP * 60) + mntP);
                                if (cptPulangBaru < 0) cptPulangBaru = 0;
                            }

                            let matchSekolah = dummySekolah.find(s => s.nama.toUpperCase().includes(record.sekolah.toUpperCase()));
                            let idSekolahVal = matchSekolah ? matchSekolah.id : "ALL";
                            let namaSekolahFinal = matchSekolah ? matchSekolah.nama : record.sekolah;

                            let indexPegawai = dummyAbsensi.findIndex(p => String(p.nip).trim() === String(record.nip).trim());
                            if (indexPegawai !== -1) {
                                dummyAbsensi[indexPegawai].hadir += hadirBaru;
                                dummyAbsensi[indexPegawai].terlambatMin += terlambatBaru;
                                dummyAbsensi[indexPegawai].cepatPulangMin += cptPulangBaru;
                                dummyAbsensi[indexPegawai].izinSakit += record.izinSakit;
                            } else {
                                dummyAbsensi.push({
                                    id: Date.now() + Math.random(),
                                    nama: record.nama, nip: record.nip, sekolah: namaSekolahFinal, sekolahId: idSekolahVal,
                                    hariKerja: 22,
                                    hadir: hadirBaru, terlambatMin: terlambatBaru, cepatPulangMin: cptPulangBaru, izinSakit: record.izinSakit, tanpaKet: 0
                                });
                            }
                        });

                        // 3. KALKULASI TANPA KETERANGAN & VALIDASI HARI KERJA
                        let peringatanHariKerja = false;
                        let hkOtomatis = hitungHariKerjaBulanIni(new Date().getFullYear(), new Date().getMonth() + 1);

                        dummyAbsensi.forEach(p => {
                            p.hariKerja = hkOtomatis;
                            let totalTercatat = p.hadir + p.izinSakit;
                            p.tanpaKet = p.hariKerja - totalTercatat;
                            
                            if (p.tanpaKet < 0) {
                                p.tanpaKet = 0;
                                peringatanHariKerja = true;
                            }
                        });
                        
                        if (peringatanHariKerja) {
                            Swal.fire({
                                icon: 'warning',
                                title: 'Perhatian Admin!',
                                text: 'Ada ASN dengan total Hadir + Izin melebihi jumlah Hari Kerja. Mohon periksa kembali kesesuaian data log atau jumlah Hari Kerja.',
                            });
                        }

                        if (typeof google !== 'undefined' && google.script && google.script.run) {
                            google.script.run.simpanRekapAbsenKeSheet(dummyAbsensi);
                        }
                        renderRekapAbsen(document.getElementById('content-area'));
                        Swal.fire('Berhasil!', 'Log absensi berhasil diunggah & direkap otomatis.', 'success');
                    }
                } catch(err) {
                    Swal.fire('Error', 'Gagal memproses file log CSV.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        function downloadExcelAbsen() {
            if(dummyAbsensi.length === 0) {
                Swal.fire('Kosong', 'Tidak ada data rekap untuk di-export.', 'warning');
                return;
            }
            let hkOtomatis = hitungHariKerjaBulanIni(new Date().getFullYear(), new Date().getMonth() + 1);
            let dataExport = dummyAbsensi.map((a, i) => ({
                'No': i + 1,
                'Nama Pegawai': a.nama,
                'NIP': a.nip,
                'Sekolah': a.sekolah,
                'Hari Kerja': hkOtomatis,
                'Hadir': a.hadir || 0,
                'Keterlambatan (Mnt)': a.terlambatMin || 0,
                'Cepat Pulang (Mnt)': a.cepatPulangMin || 0,
                'Izin/Sakit/DL': a.izinSakit || 0,
                'Tanpa Keterangan (Hari)': a.tanpaKet || 0
            }));

            let ws = XLSX.utils.json_to_sheet(dataExport);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap Absensi");
            XLSX.writeFile(wb, `Rekap_Absensi_Cabdin_Wil_IV_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // MENU LAPORAN INDISIPLINER

            let indisipliner = dummyAbsensi.filter(a => (a.tanpaKet && a.tanpaKet > 0) || (a.terlambatMin && a.terlambatMin > 0) || (a.cepatPulangMin && a.cepatPulangMin > 0));

            container.innerHTML = `
                <div class="glass-card p-6">
                    <h3 class="font-bold text-slate-700 mb-6">Daftar Pegawai Indisipliner</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-red-600 text-white text-sm">
                                    <th class="p-3 text-center w-12">No</th>
                                    <th class="p-3">Nama Pegawai</th>
                                    <th class="p-3">NIP</th>
                                    <th class="p-3">Sekolah</th>
                                    <th class="p-3 text-center">Hari Kerja</th>
                                    <th class="p-3 text-center">Hadir</th>
                                    <th class="p-3 text-center">Keterlambatan</th>
                                    <th class="p-3 text-center">Cepat Pulang</th>
                                    <th class="p-3 text-center">Izin/Sakit/DL</th>
                                    <th class="p-3 text-center">Tanpa Ket.</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${indisipliner.length > 0 ? indisipliner.map((a, i) => `
                                    <tr class="border-b hover:bg-slate-50 text-sm">
                                        <td class="p-3 text-center">${i+1}</td>
                                        <td class="p-3 font-semibold text-slate-800">${a.nama}</td>
                                        <td class="p-3 text-slate-500">${a.nip}</td>
                                        <td class="p-3">${a.sekolah}</td>
                                        <td class="p-3 text-center font-bold text-indigo-600">${hkOtomatis}</td>
                                        <td class="p-3 text-center font-bold text-blue-600">${a.hadir || 0}</td>
                                        <td class="p-3 text-center text-orange-600 font-bold">${a.terlambatMin || 0} Mnt</td>
                                        <td class="p-3 text-center text-yellow-600 font-bold">${a.cepatPulangMin || 0} Mnt</td>
                                        <td class="p-3 text-center text-emerald-600 font-bold">${a.izinSakit || 0}</td>
                                        <td class="p-3 text-center text-red-600 font-bold">${a.tanpaKet || 0} Hari</td>
                                    </tr>`).join('') : '<tr><td colspan="10" class="p-6 text-center text-slate-500">Tidak ada data pegawai indisipliner. Semua tepat waktu!</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }
    </script>
